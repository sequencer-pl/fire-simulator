[project]
name = "fire-simulator"
version = "0.2.0"
description = "Symulator niezależności finansowej (FIRE) — IKE, IKZE, ZUS, lokaty"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "sequencer-pl" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "pydantic>=2.10.0",
    "itsdangerous>=2.2.0",
    "gunicorn>=22.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "mypy>=1.11",
    # TestClient Starlette (starlette 1.6+) używa httpx2; httpx jest deprecated.
    "httpx2>=2.0.0",
]

[tool.uv]
# anyio 4.15 deprecuje alias anyio.abc.BlockingPortal, z którym jeszcze nie
# zgrało się starlette 1.6 (warning przy każdym teście przez TestClient).
constraint-dependencies = ["anyio<4.15,>=4.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
show_error_codes = true
exclude = ["tests/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
