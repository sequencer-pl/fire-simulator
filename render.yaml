services:
  - type: web
    name: fire-simulator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 1 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    # Aplikacja jest bezstanowa: nie ma bazy ani logowania. Konfiguracja i plany
    # zostają w przeglądarce użytkownika, a wynik można wyeksportować do .sim.json.
    envVars:
      - key: FIRE_ENV
        value: production
