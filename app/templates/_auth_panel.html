<div id="authPanel" class="card auth-panel hidden">
            <div class="segmented auth-tabs" role="tablist" aria-label="Logowanie lub rejestracja">
                <button type="button" class="seg-option active" id="tabLogin" role="tab">Logowanie</button>
                <button type="button" class="seg-option" id="tabRegister" role="tab">Rejestracja</button>
            </div>
            <form id="loginForm" class="auth-form">
                <div class="field">
                    <label for="loginEmail">E-mail</label>
                    <input class="input" id="loginEmail" type="email" name="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="loginPassword">Hasło</label>
                    <input class="input" id="loginPassword" type="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Zaloguj</button>
                <p id="loginMsg" class="form-msg hidden"></p>
            </form>
            <form id="registerForm" class="auth-form hidden">
                <div class="field">
                    <label for="registerEmail">E-mail</label>
                    <input class="input" id="registerEmail" type="email" name="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="registerPassword">Hasło (min. 8 znaków)</label>
                    <input class="input" id="registerPassword" type="password" name="password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Załóż konto</button>
                <p id="registerMsg" class="form-msg hidden"></p>
            </form>
        </div>
