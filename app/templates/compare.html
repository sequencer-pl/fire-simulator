<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRE Simulator — Porównanie</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='0' y2='0'%3E%3Cstop offset='0%25' stop-color='%23e74c3c'/%3E%3Cstop offset='50%25' stop-color='%23e17055'/%3E%3Cstop offset='100%25' stop-color='%23ffbe76'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M24 7C24 7 14.5 17.5 14.5 26.5 14.5 32.6 18.8 36.5 24 36.5 29.2 36.5 33.5 32.6 33.5 26.5 33.5 17.5 24 7 24 7z' fill='url(%23g)'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_version }}">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div>
                <h1>Porównanie symulacji</h1>
                <p class="subtitle" style="margin-bottom:0;" id="compareSubtitle"></p>
            </div>
            <nav class="topnav">
                <a href="/" class="btn btn-secondary" style="margin:0;">Moje symulacje</a>
                <a href="/sim" class="btn btn-secondary" style="margin:0;">Symulator</a>
                <span id="sessionBar" class="session-email"></span>
            </nav>
        </div>

        <div id="errorMsg" class="warning-item hidden"></div>

        <div id="metricsSection" class="hidden">
            <h2>Podsumowanie</h2>
            <div class="table-wrap">
                <table id="metricsTable">
                    <thead><tr></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="chartSection" class="hidden">
            <h2>Majątek w czasie</h2>
            <div id="overlayChart" class="chart-wrap"></div>
        </div>

        <div id="withdrawalSection" class="hidden">
            <h2>Miesięczne wypłaty w czasie</h2>
            <p class="subtitle">Wypłaty netto (po podatku) na miesiąc.</p>
            <div id="withdrawalChart" class="chart-wrap"></div>
        </div>

        <div id="milestonesSection" class="hidden">
            <h2>Kamienie milowe</h2>
            <div class="table-wrap">
                <table id="milestonesTable">
                    <thead><tr></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/static/js/session.js?v={{ asset_version }}"></script>
    <script src="/static/js/compare.js?v={{ asset_version }}"></script>
</body>
</html>
