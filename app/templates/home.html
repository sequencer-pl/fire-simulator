<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRE Simulator — Moje symulacje</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='fg' x1='0' y1='1' x2='0' y2='0'%3E%3Cstop offset='0%25' stop-color='%23e74c3c'/%3E%3Cstop offset='50%25' stop-color='%23e17055'/%3E%3Cstop offset='100%25' stop-color='%23ffbe76'/%3E%3C/linearGradient%3E%3ClinearGradient id='tg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%236c5ce7'/%3E%3Cstop offset='100%25' stop-color='%2300cec9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1.25' y='1.25' width='45.5' height='45.5' rx='11' fill='%23161923' stroke='url(%23tg)' stroke-width='2.5'/%3E%3Cpath d='M24 7 C24 7 14.5 17.5 14.5 26.5 C14.5 32.6 18.8 36.5 24 36.5 C29.2 36.5 33.5 32.6 33.5 26.5 C33.5 17.5 24 7 24 7 Z' fill='url(%23fg)'/%3E%3Cpath d='M24 14.5 C24 14.5 18 21.5 18 26.5 C18 30.2 20.6 33 24 33 C27.4 33 30 30.2 30 26.5 C30 21.5 24 14.5 24 14.5 Z' fill='%23161923'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/css/style.css?v={{ version }}">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div class="brand">
                <svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Płomień FIRE">
                    <defs>
                        <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
                            <stop offset="0%" stop-color="#e74c3c"/>
                            <stop offset="50%" stop-color="#e17055"/>
                            <stop offset="100%" stop-color="#ffbe76"/>
                        </linearGradient>
                        <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#6c5ce7"/>
                            <stop offset="100%" stop-color="#00cec9"/>
                        </linearGradient>
                    </defs>
                    <rect x="1.25" y="1.25" width="45.5" height="45.5" rx="11" fill="#161923" stroke="url(#tileGrad)" stroke-width="2.5"/>
                    <path d="M24 7 C24 7 14.5 17.5 14.5 26.5 C14.5 32.6 18.8 36.5 24 36.5 C29.2 36.5 33.5 32.6 33.5 26.5 C33.5 17.5 24 7 24 7 Z" fill="url(#flameGrad)"/>
                    <path d="M24 14.5 C24 14.5 18 21.5 18 26.5 C18 30.2 20.6 33 24 33 C27.4 33 30 30.2 30 26.5 C30 21.5 24 14.5 24 14.5 Z" fill="#161923"/>
                </svg>
                <div>
                    <h1><span class="brand-fire">FIRE</span> <span class="brand-sim">Simulator</span></h1>
                    <p class="subtitle" style="margin-bottom:0;">Twoje zapisane symulacje</p>
                </div>
            </div>
            <nav class="topnav">
                <a href="/sim" class="btn btn-secondary" style="margin:0;">Symulator</a>
                <span id="sessionBar" class="session-email"></span>
            </nav>
        </div>

        <!-- Autoryzacja -->
        <div id="authPanel" class="auth-panel hidden">
            <div class="auth-tabs">
                <button type="button" class="mode-btn active" id="tabLogin">Logowanie</button>
                <button type="button" class="mode-btn" id="tabRegister">Rejestracja</button>
            </div>
            <form id="loginForm" class="auth-form">
                <div class="field-group">
                    <label>E-mail</label>
                    <input type="email" name="email" required>
                </div>
                <div class="field-group">
                    <label>Hasło</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">Zaloguj</button>
                <p id="loginMsg" class="form-msg"></p>
            </form>
            <form id="registerForm" class="auth-form hidden">
                <div class="field-group">
                    <label>E-mail</label>
                    <input type="email" name="email" required>
                </div>
                <div class="field-group">
                    <label>Hasło (min. 8 znaków)</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">Zarejestruj</button>
                <p id="registerMsg" class="form-msg"></p>
            </form>
        </div>

        <!-- Lista symulacji -->
        <div id="simsPanel" class="hidden">
            <div class="sim-topbar">
                <a href="/sim" class="btn btn-primary" style="margin:0;text-decoration:none;">+ Nowa symulacja</a>
            </div>
            <div id="simsList" class="sims-list"></div>
            <div id="simFooter" class="sim-footer">
                <div class="sim-footer-left">
                    <label class="sim-select-all-label">
                        <input type="checkbox" id="selectAllCb" title="Zaznacz / odznacz wszystkie">
                        <span id="compareCount" class="sim-count"></span>
                    </label>
                </div>
                <div class="sim-footer-right">
                    <button type="button" id="exportBtn" class="btn btn-secondary" disabled>Eksportuj zaznaczone</button>
                    <button type="button" id="compareBtn" class="btn btn-secondary" disabled>Porównaj zaznaczone</button>
                    <div class="sim-footer-divider"></div>
                    <button type="button" id="deleteBulkBtn" class="btn btn-danger" disabled>Usuń zaznaczone</button>
                </div>
            </div>
            <p id="emptyMsg" class="form-msg hidden">Brak zapisanych symulacji. Uruchom symulator i zapisz wynik, aby zobaczyć go tutaj.</p>
        </div>
    </div>

    <script src="/static/js/session.js?v={{ version }}"></script>
    <script src="/static/js/home.js?v={{ version }}"></script>
</body>
</html>
