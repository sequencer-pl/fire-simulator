name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check app/ tests/ scripts/

      - name: Mypy
        run: uv run mypy app/

      - name: Run tests
        run: uv run pytest

  jsdom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install jsdom harness
        run: npm ci --prefix qa/jsdom

      - name: Run jsdom harness
        run: npm --prefix qa/jsdom test

  visual:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright harness
        run: npm ci --prefix qa/visual

      - name: Install Chromium
        run: cd qa/visual && npx playwright install --with-deps chromium

      - name: Start app and run visual regression
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then
            echo "Serwer nie wstał" >&2
            kill "$SERVER_PID" || true
            exit 1
          fi
          npm --prefix qa/visual run check
          STATUS=$?
          kill "$SERVER_PID" || true
          exit $STATUS
